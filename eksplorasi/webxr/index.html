<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eksplorasi WebXR · A-Frame</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script>
    // Komponen kecil: setiap kali objek dipilih (klik, sentuh, atau controller), catat kejadiannya.
    AFRAME.registerComponent('catat-pilih', {
      init() {
        this.jumlah = 0;
        this.el.addEventListener('click', () => {
          this.jumlah += 1;
          const status = document.querySelector('#status');
          status.setAttribute('value', `Dipilih ${this.jumlah} kali`);
          this.el.setAttribute('color', this.jumlah % 2 ? '#2dc75c' : '#fe9f4d');
        });
      }
    });
  </script>
</head>
<body>
  <!--
    Cara mencoba:
    - Laptop: seret untuk melihat sekeliling, klik kotak untuk memilih.
    - Ponsel Android (Chrome): tekan tombol AR di pojok kanan bawah bila tersedia.
    - Headset (misalnya Meta Quest): buka tautan GitHub Pages di browser headset, tekan tombol VR.
    WebXR hanya berjalan lewat https, jadi uji lewat tautan GitHub Pages, bukan file lokal.
  -->
  <a-scene renderer="colorManagement: true" background="color: #fff5ed">
    <a-entity camera look-controls wasd-controls position="0 1.6 0">
      <a-entity cursor="rayOrigin: mouse" raycaster="objects: .bisa-dipilih"></a-entity>
    </a-entity>
    <a-entity laser-controls="hand: right" raycaster="objects: .bisa-dipilih"></a-entity>

    <a-box class="bisa-dipilih" catat-pilih position="0 1.2 -2" rotation="0 45 0" depth="0.6" height="0.6" width="0.6" color="#fe9f4d"></a-box>
    <a-cylinder position="0 0.45 -2" radius="0.5" height="0.9" color="#f8d3af"></a-cylinder>
    <a-text id="status" value="Pilih kotak oranye" align="center" position="0 2 -2" color="#1a1a1a" width="3"></a-text>
    <a-plane rotation="-90 0 0" width="12" height="12" color="#f8d3af"></a-plane>
    <a-light type="hemisphere" color="#ffffff" ground-color="#f8d3af" intensity="1"></a-light>
  </a-scene>
</body>
</html>
